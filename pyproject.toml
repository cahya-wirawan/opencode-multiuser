[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "opencode-multiuser"
version = "0.6.7"
description = "Single-host multi-user OpenCode gateway for rootless Podman, systemd and Traefik"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=25.1,<26",
  "httpx>=0.28,<1",
  "websockets>=15,<17",
  "Authlib>=1.8,<2",
  "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
